# one add-on: this file is what the Add-ons page and the marketplace show
id: aliases
name: Aliases
icon: shield
order: 40
author: MaxJC0
license: AGPL-3.0
warning: "Uses DuckDuckGo Email Protection's unofficial API (the one its browsers use); it may change without notice."
version: 0.1.0
desc: "Your DuckDuckGo @duck.com aliases in one list: make new ones with a label, switch them off, find which site has which."
routes: [/aliases]
needs: [DuckDuckGo Email Protection account]
depends_on: []
# the alias list lives on pve (DDG can't list them); the login token is in /etc/dash/secrets/aliases.json
backup:
  - { path: /var/lib/dash-aliases }
palette:
  - { label: "Duck aliases", to: /aliases, icon: shield, keywords: [duck, email, alias, ddg] }
