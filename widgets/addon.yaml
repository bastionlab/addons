# one add-on: this file is what the Add-ons page (and later the marketplace index) shows
id: widgets
name: Widgets
icon: grid
order: 95
author: MaxJC0
license: AGPL-3.0
version: 0.1.1
desc: "Build your own Home widgets from an API, metric, service, task or note, or describe one to Claude. Install widget packs from the marketplace."
routes: [/widgets]
home: true
needs: [Claude login]
depends_on: [designs]
roles: { view: owner, use: owner }
# web/ is a Nuxt layer; widget definitions live in the synced settings (widgets:defs, widgets:place:<device>), no database.
# /widgets only redirects to Home: the builder is a sheet in Home's edit mode.
