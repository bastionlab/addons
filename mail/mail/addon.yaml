# one add-on: this file is what the Add-ons page (and later the marketplace index) shows
id: mail
name: Mail
icon: mail-open
order: 6
author: MaxJC0
license: AGPL-3.0
version: 0.2.0
desc: "Read mail over IMAP and sort it into your own categories (rules first, then the local model, learning from your corrections), draft replies, send only on your confirmation."
routes: [/mail]
home: false
needs: []
depends_on: []
# accounts and their passwords are managed on the Mail page (Accounts tab), which writes /etc/dash/settings/mail.json and
# /etc/dash/secrets/mail.json itself. Only the optional second-opinion model is set on the generic Settings page.
settings:
  - { key: judge_model, label: "Second-opinion model for unsure mail (empty = off)", type: text, default: "", help: "An Ollama model name, e.g. a bigger one; asked only when the first answer is below the threshold" }
  - { key: judge_below, label: "Ask the second model below this confidence", type: number, default: 0.6, min: 0, max: 1 }
